  function typeBadge(type, opmerking) {
    if (type === 'afwezig') return '<span class="badge rood">Afwezig</span>';
    if (type === 'standby') return '<span class="badge standby">Standby</span>';
    return `<span class="badge neutraal" title="${App.ui.escapeHtml(opmerking)}">${App.ui.escapeHtml(opmerking || 'Anders')}</span>`;
  }

  function tekenMatrix() {
    const van = App.datum.parseIso(document.getElementById('matrixVan').value);
    const tot = App.datum.parseIso(document.getElementById('matrixTot').value);
    const medewerkers = App.data.medewerkers();
    const verlof = App.data.verlof();
    const wrap = document.getElementById('matrixWrap');

    if (van > tot) { wrap.innerHTML = '<p class="leeg-melding">Ongeldige periode.</p>'; return; }
    const dagen = App.datum.alleDagenTussen(van, tot);
    if (!dagen.length) { wrap.innerHTML = '<p class="leeg-melding">Geen dagen in deze periode.</p>'; return; }

    const perMedewerkerDatum = {};
    verlof.forEach(v => { perMedewerkerDatum[v.medewerkerId + '|' + v.datum] = v; });

    const header = `<tr><th>Datum</th><th>Dag</th>${medewerkers.map(m => `<th>${App.ui.escapeHtml(m.naam)}</th>`).join('')}</tr>`;
    let vorigeWeekLabel = null;
    const kolomAantal = 2 + medewerkers.length;
    let rijen = '';

    dagen.forEach(dag => {
      const wk = App.datum.isoWeek(dag);
      const weekLabel = `Week ${wk.week}, ${wk.jaar}`;
      if (weekLabel !== vorigeWeekLabel) {
        rijen += `<tr class="week-header"><td colspan="${kolomAantal}">${weekLabel}</td></tr>`;
        vorigeWeekLabel = weekLabel;
      }
      const iso = App.datum.naarIso(dag);
      const nietWerkdag = !App.datum.isWerkdag(dag);
      const feestNaam = App.datum.feestdagNaam(dag);
      const dagLabel = App.datum.DAGEN_KORT[dag.getDay()] + (feestNaam ? ` (${App.ui.escapeHtml(feestNaam)})` : '');
      const cellen = medewerkers.map(m => {
        const v = perMedewerkerDatum[m.id + '|' + iso];
        return `<td>${v ? typeBadge(v.type, v.opmerking) : ''}</td>`;
      }).join('');
      rijen += `<tr class="${nietWerkdag ? 'niet-werkdag' : ''}"><td>${App.datum.formatKort(dag)}</td><td>${dagLabel}</td>${cellen}</tr>`;
    });

    wrap.innerHTML = `<table><thead>${header}</thead><tbody>${rijen}</tbody></table>`;
  }

  function volgendeKalenderDag(d) {
    const r = new Date(d.getTime());
    r.setDate(r.getDate() + 1);
    return r;
  }

  const WEEKDAG_VOL = { 0: 'zondag', 1: 'maandag', 2: 'dinsdag', 3: 'woensdag', 4: 'donderdag', 5: 'vrijdag', 6: 'zaterdag' };

  // Voegt opeenvolgende dagen (incl. weekenden) met dezelfde medewerker/type/opmerking samen tot één periode-rij
  function groepeerOpeenvolgend(lijst) {
    const sortedVoorGroepering = [...lijst].sort((a, b) =>
      a.medewerkerId.localeCompare(b.medewerkerId) || a.type.localeCompare(b.type) ||
      (a.opmerking || '').localeCompare(b.opmerking || '') || a.datum.localeCompare(b.datum)
    );
    const groepen = [];
    sortedVoorGroepering.forEach(v => {
      const laatste = groepen[groepen.length - 1];
      const verwachteVolgende = laatste ? App.datum.naarIso(volgendeKalenderDag(App.datum.parseIso(laatste.eindDatum))) : null;
      if (laatste && laatste.medewerkerId === v.medewerkerId && laatste.type === v.type &&
        (laatste.opmerking || '') === (v.opmerking || '') && verwachteVolgende === v.datum) {
        laatste.eindDatum = v.datum;
        laatste.ids.push(v.id);
      } else {
        groepen.push({ medewerkerId: v.medewerkerId, type: v.type, opmerking: v.opmerking, startDatum: v.datum, eindDatum: v.datum, ids: [v.id], herhalend: false });
      }
    });
    return groepen;
  }

  // Voegt alle voorkomens van dezelfde terugkerende reeks (medewerker/type/opmerking/weekdag) samen tot één rij
  function groepeerTerugkerend(lijst) {
    const perSleutel = {};
    lijst.forEach(v => {
      const weekdag = App.datum.parseIso(v.datum).getDay();
      const sleutel = [v.medewerkerId, v.type, v.opmerking || '', weekdag].join('|');
      if (!perSleutel[sleutel]) perSleutel[sleutel] = [];
      perSleutel[sleutel].push(v);
    });

    return Object.values(perSleutel).map(entries => {
      const datums = entries.map(e => e.datum).sort();
      const diffsInDagen = [];
      for (let i = 1; i < datums.length; i++) {
        diffsInDagen.push((App.datum.parseIso(datums[i]) - App.datum.parseIso(datums[i - 1])) / 86400000);
      }
      const alle7 = diffsInDagen.length > 0 && diffsInDagen.every(d => d === 7);
      const alle14 = diffsInDagen.length > 0 && diffsInDagen.every(d => d === 14);
      const intervalLabel = alle7 ? 'Elke ' : alle14 ? 'Om de week op ' : 'Periodiek op ';
      return {
        medewerkerId: entries[0].medewerkerId, type: entries[0].type, opmerking: entries[0].opmerking,
        startDatum: datums[0], eindDatum: datums[datums.length - 1],
        ids: entries.map(e => e.id), herhalend: true, intervalLabel
      };
    });
  }

  function groepeerVoorWeergave(lijst) {
    const herhalendLijst = lijst.filter(v => v.herhalend);
    const normaalLijst = lijst.filter(v => !v.herhalend);
    const groepen = [...groepeerOpeenvolgend(normaalLijst), ...groepeerTerugkerend(herhalendLijst)];
    return groepen.sort((a, b) => b.startDatum.localeCompare(a.startDatum));
  }

  function periodeTekst(groep) {
    const bereik = groep.startDatum === groep.eindDatum
      ? App.datum.formatKort(App.datum.parseIso(groep.startDatum))
      : `${App.datum.formatKort(App.datum.parseIso(groep.startDatum))} t/m ${App.datum.formatKort(App.datum.parseIso(groep.eindDatum))}`;
    if (!groep.herhalend) return bereik;
    const weekdag = WEEKDAG_VOL[App.datum.parseIso(groep.startDatum).getDay()];
    return `${groep.intervalLabel}${weekdag}, ${bereik}`;
  }

  function tekenLijst() {
    const medewerkers = App.data.medewerkers();
    const naamVan = id => (medewerkers.find(m => m.id === id) || {}).naam || 'Onbekend';
    let verlofData = App.data.verlof();
    if (filterMedewerkerId) verlofData = verlofData.filter(v => v.medewerkerId === filterMedewerkerId);
    const groepen = groepeerVoorWeergave(verlofData);
    const tbody = document.getElementById('verlofTbody');

    if (!groepen.length) {
      tbody.innerHTML = '<tr><td colspan="5" class="leeg-melding">Geen verlof gevonden.</td></tr>';
      return;
    }
    tbody.innerHTML = groepen.map((g, idx) => `
      <tr>
        <td>${App.ui.escapeHtml(naamVan(g.medewerkerId))}</td>
        <td>${periodeTekst(g)}</td>
        <td>${typeBadge(g.type, g.opmerking)}</td>
        <td>${App.ui.escapeHtml(g.opmerking)}</td>
        <td>
          <button class="btn secundair klein" data-actie="wijzig" data-idx="${idx}">Wijzig</button>
          <button class="btn gevaar klein" data-actie="verwijder" data-idx="${idx}">Verwijder${g.herhalend ? ' reeks' : ''}</button>
        </td>
      </tr>
    `).join('');

    tbody.querySelectorAll('[data-actie="wijzig"]').forEach(b => b.addEventListener('click', () => {
      const groep = groepen[Number(b.dataset.idx)];
      if (groep.herhalend) beginWijzigTerugkerend(groep); else beginWijzig(groep);
    }));
    tbody.querySelectorAll('[data-actie="verwijder"]').forEach(b => b.addEventListener('click', () => verwijder(groepen[Number(b.dataset.idx)])));
  }

  function beginWijzig(groep) {
    bewerkIds = groep.ids;
    const form = document.getElementById('verlofForm');
    form.medewerkerId.value = groep.medewerkerId;
    form.startDatum.value = groep.startDatum;
    form.eindDatum.value = groep.eindDatum !== groep.startDatum ? groep.eindDatum : '';
    form.type.value = groep.type;
    form.opmerking.value = groep.opmerking || '';
    document.getElementById('formTitel').textContent = 'Verlof/standby wijzigen';
    document.getElementById('annuleerBtn').style.display = 'inline-block';
    form.scrollIntoView({ behavior: 'smooth' });
  }

  function resetForm() {
    bewerkIds = null;
    document.getElementById('verlofForm').reset();
    document.getElementById('formTitel').textContent = 'Verlof/standby toevoegen';
    document.getElementById('annuleerBtn').style.display = 'none';
  }

  function beginWijzigTerugkerend(groep) {
    bewerkTerugkerendIds = groep.ids;
    const form = document.getElementById('terugkerendForm');
    form.medewerkerId.value = groep.medewerkerId;
    form.weekdag.value = String(App.datum.parseIso(groep.startDatum).getDay());
    form.interval.value = groep.intervalLabel === 'Om de week op ' ? '2' : '1';
    form.type.value = groep.type;
    form.vanaf.value = groep.startDatum;
    form.tot.value = groep.eindDatum;
    form.opmerking.value = groep.opmerking || '';
    document.getElementById('terugkerendFormTitel').textContent = 'Terugkerend verlof wijzigen';
    document.getElementById('terugkerendSubmitBtn').textContent = 'Wijzigingen opslaan';
    document.getElementById('annuleerTerugkerendBtn').style.display = 'inline-block';
    form.scrollIntoView({ behavior: 'smooth' });
  }

  function resetTerugkerendForm() {
    bewerkTerugkerendIds = null;
    document.getElementById('terugkerendForm').reset();
    document.getElementById('terugkerendFormTitel').textContent = 'Terugkerend verlof (vaste vrije dag)';
    document.getElementById('terugkerendSubmitBtn').textContent = 'Terugkerend verlof toevoegen';
    document.getElementById('annuleerTerugkerendBtn').style.display = 'none';
  }

  function opSlaan(e) {
    e.preventDefault();
    const form = e.target;
    const medewerkerId = form.medewerkerId.value;
    const type = form.type.value;
    const opmerking = form.opmerking.value.trim();
    if (!medewerkerId) return;

    let lijst = App.data.verlof();
    if (bewerkIds) lijst = lijst.filter(x => !bewerkIds.includes(x.id));

    const start = App.datum.parseIso(form.startDatum.value);
    const eind = form.eindDatum.value ? App.datum.parseIso(form.eindDatum.value) : start;
    App.datum.werkdagenTussen(start, eind).forEach(dag => {
      const iso = App.datum.naarIso(dag);
      const bestaand = lijst.find(x => x.medewerkerId === medewerkerId && x.datum === iso);
      const overrides = { medewerkerId, datum: iso, type, opmerking };
      if (bestaand) overrides.id = bestaand.id;
      App.data.upsert(lijst, App.model.nieuwVerlof(overrides));
    });

    App.data.bewaarVerlof(lijst);
    App.ui.melding('Verlof opgeslagen');
    resetForm();
    tekenMatrix();
    tekenLijst();
  }

  function verwijder(groep) {
    if (!confirm(`Verlof ${periodeTekst(groep)} verwijderen?`)) return;
    App.data.bewaarVerlof(App.data.verlof().filter(x => !groep.ids.includes(x.id)));
    tekenMatrix();
    tekenLijst();
  }

  function voegTerugkerendToe(e) {
    e.preventDefault();
    const form = e.target;
    const medewerkerId = form.medewerkerId.value;
    const weekdag = Number(form.weekdag.value);
    const interval = Number(form.interval.value);
    const type = form.type.value;
    const opmerking = form.opmerking.value.trim();
    const vanaf = App.datum.parseIso(form.vanaf.value);
    const tot = App.datum.parseIso(form.tot.value);

    if (!medewerkerId || !form.vanaf.value || !form.tot.value || vanaf > tot) {
      App.ui.melding('Controleer medewerker en periode');
      return;
    }

    const eersteDatum = new Date(vanaf.getTime());
    while (eersteDatum.getDay() !== weekdag) eersteDatum.setDate(eersteDatum.getDate() + 1);

    let lijst = App.data.verlof();
    if (bewerkTerugkerendIds) lijst = lijst.filter(x => !bewerkTerugkerendIds.includes(x.id));

    let aantal = 0;
    for (let d = new Date(eersteDatum.getTime()); d <= tot; d.setDate(d.getDate() + 7 * interval)) {
      if (!App.datum.isWerkdag(d)) continue; // slaat NL-feestdagen op deze weekdag over
      const iso = App.datum.naarIso(d);
      const bestaand = lijst.find(x => x.medewerkerId === medewerkerId && x.datum === iso);
      const overrides = { medewerkerId, datum: iso, type, opmerking, herhalend: true };
      if (bestaand) overrides.id = bestaand.id;
      App.data.upsert(lijst, App.model.nieuwVerlof(overrides));
      aantal++;
    }

    App.data.bewaarVerlof(lijst);
    App.ui.melding(bewerkTerugkerendIds ? 'Terugkerend verlof gewijzigd' : `${aantal} terugkerende verlofdagen toegevoegd`);
    resetTerugkerendForm();
    tekenMatrix();
    tekenLijst();
  }

  function detecteerDelimiter(regel) {
    if (regel.includes('\t')) return '\t';
    if (regel.includes(';')) return ';';
    return ',';
  }

  function verwerkImport(tekst) {
    const regels = tekst.split(/\r?\n/).filter(r => r.trim().length > 0);
    if (regels.length < 2) { App.ui.melding('Geen importdata gevonden'); return; }

    const delim = detecteerDelimiter(regels[0]);
    const header = regels[0].split(delim).map(s => s.trim());
    const medewerkers = App.data.medewerkers();
    const medewerkerKolommen = header.slice(3).map(naam => medewerkers.find(m => m.naam.toLowerCase() === naam.toLowerCase()));
    const onbekend = new Set();
    header.slice(3).forEach((naam, i) => { if (!medewerkerKolommen[i]) onbekend.add(naam); });

    const verlofLijst = App.data.verlof();
    let ingevoerd = 0, overgeslagen = 0;

    for (let i = 1; i < regels.length; i++) {
      const cellen = regels[i].split(delim).map(s => s.trim());
      const datumObj = App.datum.parseFlexibel(cellen[0]);
      if (!datumObj) { overgeslagen++; continue; }
      const iso = App.datum.naarIso(datumObj);
      for (let k = 3; k < cellen.length; k++) {
        const medewerker = medewerkerKolommen[k - 3];
        if (!medewerker) continue;
        const waarde = (cellen[k] || '').trim();
        if (!waarde) continue;
        const laag = waarde.toLowerCase();
        let type = 'anders', opmerking = '';
        if (laag === 'afwezig') type = 'afwezig';
        else if (laag === 'standby') type = 'standby';
        else opmerking = waarde;

        const bestaand = verlofLijst.find(v => v.medewerkerId === medewerker.id && v.datum === iso);
        const overrides = { medewerkerId: medewerker.id, datum: iso, type, opmerking };
        if (bestaand) overrides.id = bestaand.id;
        App.data.upsert(verlofLijst, App.model.nieuwVerlof(overrides));
        ingevoerd++;
      }
    }

    App.data.bewaarVerlof(verlofLijst);
    let msg = `${ingevoerd} verlofregels geïmporteerd`;
    if (overgeslagen) msg += `, ${overgeslagen} rijen overgeslagen (datum onherkenbaar)`;
    if (onbekend.size) msg += `. Onbekende medewerkers genegeerd: ${[...onbekend].join(', ')}`;
    App.ui.melding(msg);
    render(document.getElementById('pageContent'));
  }

  function importeer() {
    const bestand = document.getElementById('importBestand').files[0];
    if (bestand) {
      const reader = new FileReader();
      reader.onload = () => verwerkImport(reader.result);
      reader.readAsText(bestand);
      return;
    }
    const tekst = document.getElementById('importTekst').value;
    verwerkImport(tekst);
  }

  return { render };
})();
</script>
<script>
// Pagina: Capaciteitsplanning / werkitems beheren (CRUD)
window.App = window.App || {};

App.pages.werkitems = (function () {
  let bewerkId = null;

  function render(container) {
    const medewerkers = App.data.medewerkers();
    container.innerHTML = `
      <h2>Capaciteitsplanning</h2>
      <div class="card">
        <h3 id="formTitel">Nieuw werkitem</h3>
        <form id="werkitemForm">
          <div class="rij">
            <div class="veld" style="flex:2"><label>Titel</label><input name="titel" required></div>
            <div class="veld"><label>Type werk</label>
              <select name="type">
                <option value="operatie">Operatie</option>
                <option value="valuestream">Valuestream</option>
                <option value="project" selected>Project</option>
                <option value="incident">Incident/ad-hoc</option>
              </select>
            </div>
          </div>
          <div class="rij">
            <div class="veld"><label>Startdatum</label><input type="date" name="startDatum" required></div>
            <div class="veld"><label>Einddatum</label><input type="date" name="eindDatum" required></div>
          </div>
          <div class="rij">
            <div class="veld"><label>Team</label><input name="team" value="BT"></div>
            <div class="veld"><label>Applicatie</label><input name="applicatie"></div>
            <div class="veld"><label>Waardestroom</label><input name="waardestroom"></div>
          </div>
          <div class="rij">
            <div class="veld"><label>Prioriteit</label>
              <select name="prioriteit"><option value="laag">Laag</option><option value="gemiddeld" selected>Gemiddeld</option><option value="hoog">Hoog</option></select>
            </div>
            <div class="veld"><label>Status</label>
              <select name="status"><option value="gepland" selected>Gepland</option><option value="lopend">Lopend</option><option value="afgerond">Afgerond</option><option value="geannuleerd">Geannuleerd</option></select>
            </div>
          </div>
          <div class="veld">
            <label>Betrokken medewerker(s)</label>
            <div class="checklijst" id="medewerkerCheck">${medewerkers.map(m => `<label><input type="checkbox" value="${m.id}"> ${App.ui.escapeHtml(m.naam)}</label>`).join('') || '<em>Geen medewerkers</em>'}</div>
          </div>
          <div class="veld">
            <label>Weekplanning per medewerker (geschatte uren per week, per persoon)</label>
            <p style="font-size:13px;color:#6b7280;margin:2px 0">Vul periode en medewerkers in en klik hieronder om de weekvelden aan te maken. Vul daarna per week en per medewerker de uren in. Met "Kopieer" zet je één week door naar alle overige weken.</p>
            <button type="button" id="genereerWeekBtn" class="btn secundair klein">Weekvelden aanmaken/verversen</button>
            <div id="weekplanningWrap" class="tabel-wrap" style="margin-top:8px"></div>
          </div>
          <div class="veld"><label>Opmerking</label><input name="opmerking"></div>
          <button type="submit" class="btn">Opslaan</button>
          <button type="button" id="annuleerBtn" class="btn secundair" style="display:none">Annuleren</button>
        </form>
      </div>
      <div class="card">
        <div class="tabel-wrap">
          <table>
            <thead><tr>
              <th>Titel</th><th>Type</th><th>Periode</th><th>Uren</th><th>Medewerkers</th>
              <th>Team</th><th>Applicatie</th><th>Waardestroom</th><th>Prioriteit</th><th>Status</th><th></th>
            </tr></thead>
            <tbody id="werkitemTbody"></tbody>
          </table>
        </div>
      </div>
    `;

    vulTabel();
    tekenWeekplanning({}, []);
    document.getElementById('werkitemForm').addEventListener('submit', opSlaan);
    document.getElementById('annuleerBtn').addEventListener('click', resetForm);
    document.getElementById('genereerWeekBtn').addEventListener('click', genereerWeekplanning);
  }

  function genereerWeekplanning() {
    const form = document.getElementById('werkitemForm');
    const medewerkerIds = [...document.querySelectorAll('#medewerkerCheck input:checked')].map(cb => cb.value);
    if (!form.startDatum.value || !form.eindDatum.value || !medewerkerIds.length) {
      App.ui.melding('Vul eerst periode en minimaal 1 medewerker in');
      return;
    }
    const start = App.datum.parseIso(form.startDatum.value);
    const eind = App.datum.parseIso(form.eindDatum.value);
    if (start > eind) { App.ui.melding('Startdatum moet voor einddatum liggen'); return; }
    const weken = App.datum.wekenTussen(start, eind);
    const bestaand = lezenWeekUren();
    const weekUren = {};
    weken.forEach(w => {
      weekUren[w.weekKey] = {};
      medewerkerIds.forEach(id => weekUren[w.weekKey][id] = (bestaand[w.weekKey] && bestaand[w.weekKey][id]) || 0);
    });
    tekenWeekplanning(weekUren, medewerkerIds);
  }

  function tekenWeekplanning(weekUren, medewerkerIds) {
    const medewerkers = App.data.medewerkers();
    const wrap = document.getElementById('weekplanningWrap');
    const weekKeys = Object.keys(weekUren).sort();
    if (!weekKeys.length || !medewerkerIds.length) {
      wrap.innerHTML = '<p class="leeg-melding">Nog geen weekplanning. Vul periode en medewerkers in en klik op "Weekvelden aanmaken/verversen".</p>';
      return;
    }
    const gekozen = medewerkerIds.map(id => medewerkers.find(m => m.id === id)).filter(Boolean);
    const header = `<tr><th>Week</th>${gekozen.map(m => `<th>${App.ui.escapeHtml(m.naam)}</th>`).join('')}<th></th></tr>`;
    const rijen = weekKeys.map(wk => {
      const cellen = gekozen.map(m => {
        const waarde = (weekUren[wk] && weekUren[wk][m.id]) || 0;
        return `<td><input type="number" min="0" step="0.5" data-week="${wk}" data-medewerker="${m.id}" value="${waarde}" style="width:70px"></td>`;
      }).join('');
      return `<tr><td>${wk}</td>${cellen}<td><button type="button" class="btn secundair klein" data-kopieer-week="${wk}">Kopieer naar alle weken</button></td></tr>`;
    }).join('');
    wrap.innerHTML = `<table><thead>${header}</thead><tbody>${rijen}</tbody></table>`;

    wrap.querySelectorAll('[data-kopieer-week]').forEach(btn =>
      btn.addEventListener('click', () => kopieerWeekNaarAlle(btn.dataset.kopieerWeek)));
  }

  function kopieerWeekNaarAlle(bronWeek) {
    const waarden = {};
    document.querySelectorAll(`#weekplanningWrap input[data-week="${bronWeek}"]`).forEach(input => {
      waarden[input.dataset.medewerker] = input.value;
    });
    document.querySelectorAll('#weekplanningWrap input[data-week]').forEach(input => {
      if (input.dataset.week !== bronWeek && waarden[input.dataset.medewerker] != null) {
        input.value = waarden[input.dataset.medewerker];
      }
    });
    App.ui.melding('Uren gekopieerd naar alle weken');
  }

  function lezenWeekUren() {
    const result = {};
    document.querySelectorAll('#weekplanningWrap input[data-week]').forEach(input => {
      const wk = input.dataset.week, mid = input.dataset.medewerker;
      if (!result[wk]) result[wk] = {};
      result[wk][mid] = Number(input.value) || 0;
    });
    return result;
  }

  function totaalUrenWerkitem(w) {
    return Object.values(w.weekUren || {}).reduce((som, perWeek) =>
      som + Object.values(perWeek).reduce((s, u) => s + (Number(u) || 0), 0), 0);
  }

  const TYPE_LABEL = { operatie: 'Operatie', valuestream: 'Valuestream', project: 'Project', incident: 'Incident/ad-hoc' };

  function naamVan(id, medewerkers) { return (medewerkers.find(m => m.id === id) || {}).naam || 'Onbekend'; }

  function vulTabel() {
    const lijst = App.data.werkitems();
    const medewerkers = App.data.medewerkers();
    const tbody = document.getElementById('werkitemTbody');
    if (!lijst.length) {
      tbody.innerHTML = '<tr><td colspan="11" class="leeg-melding">Nog geen werkitems toegevoegd.</td></tr>';
      return;
    }
    tbody.innerHTML = lijst.map(w => `
      <tr>
        <td>${App.ui.escapeHtml(w.titel)}</td>
        <td>${TYPE_LABEL[w.type] || w.type}</td>
        <td>${w.startDatum} &rarr; ${w.eindDatum}</td>
        <td>${totaalUrenWerkitem(w)}</td>
        <td>${w.medewerkerIds.map(id => App.ui.escapeHtml(naamVan(id, medewerkers))).join(', ')}</td>
        <td>${App.ui.escapeHtml(w.team)}</td>
        <td>${App.ui.escapeHtml(w.applicatie)}</td>
        <td>${App.ui.escapeHtml(w.waardestroom)}</td>
        <td>${App.ui.escapeHtml(w.prioriteit)}</td>
        <td>${App.ui.escapeHtml(w.status)}</td>
        <td>
          <button class="btn secundair klein" data-actie="wijzig" data-id="${w.id}">Wijzig</button>
          <button class="btn gevaar klein" data-actie="verwijder" data-id="${w.id}">Verwijder</button>
        </td>
      </tr>
    `).join('');

    tbody.querySelectorAll('[data-actie="wijzig"]').forEach(b => b.addEventListener('click', () => beginWijzig(b.dataset.id)));
    tbody.querySelectorAll('[data-actie="verwijder"]').forEach(b => b.addEventListener('click', () => verwijder(b.dataset.id)));
  }

  function beginWijzig(id) {
    const w = App.data.werkitems().find(x => x.id === id);
    if (!w) return;
    bewerkId = id;
    const form = document.getElementById('werkitemForm');
    form.titel.value = w.titel;
    form.type.value = w.type;
    form.startDatum.value = w.startDatum;
    form.eindDatum.value = w.eindDatum;
    form.team.value = w.team;
    form.applicatie.value = w.applicatie;
    form.waardestroom.value = w.waardestroom;
    form.prioriteit.value = w.prioriteit;
    form.status.value = w.status;
    form.opmerking.value = w.opmerking || '';
    document.querySelectorAll('#medewerkerCheck input').forEach(cb => { cb.checked = w.medewerkerIds.includes(cb.value); });
    tekenWeekplanning(w.weekUren || {}, w.medewerkerIds);
    document.getElementById('formTitel').textContent = 'Werkitem wijzigen';
    document.getElementById('annuleerBtn').style.display = 'inline-block';
    form.scrollIntoView({ behavior: 'smooth' });
  }

  function resetForm() {
    bewerkId = null;
    const form = document.getElementById('werkitemForm');
    form.reset();
    form.team.value = 'BT';
    document.querySelectorAll('#medewerkerCheck input').forEach(cb => cb.checked = false);
    tekenWeekplanning({}, []);
    document.getElementById('formTitel').textContent = 'Nieuw werkitem';
    document.getElementById('annuleerBtn').style.display = 'none';
  }

  function opSlaan(e) {
    e.preventDefault();
    const form = e.target;
    const medewerkerIds = [...document.querySelectorAll('#medewerkerCheck input:checked')].map(cb => cb.value);
    const data = {
      titel: form.titel.value.trim(),
      type: form.type.value,
      startDatum: form.startDatum.value,
      eindDatum: form.eindDatum.value,
      medewerkerIds,
      team: form.team.value.trim(),
      applicatie: form.applicatie.value.trim(),
      waardestroom: form.waardestroom.value.trim(),
      prioriteit: form.prioriteit.value,
      status: form.status.value,
      opmerking: form.opmerking.value.trim(),
      weekUren: lezenWeekUren()
    };
    if (!data.titel || data.startDatum > data.eindDatum) {
      App.ui.melding('Controleer titel en periode (startdatum moet voor einddatum liggen)');
      return;
    }
    if (!Object.keys(data.weekUren).length) {
      App.ui.melding('Maak eerst de weekplanning aan en vul de uren per week/medewerker in');
      return;
    }

    const lijst = App.data.werkitems();
    if (bewerkId) {
      App.data.upsert(lijst, Object.assign({ id: bewerkId }, data));
      App.ui.melding('Werkitem gewijzigd');
    } else {
      App.data.upsert(lijst, App.model.nieuwWerkitem(data));
      App.ui.melding('Werkitem toegevoegd');
    }
    App.data.bewaarWerkitems(lijst);
    resetForm();
    vulTabel();
  }

  function verwijder(id) {
    if (!confirm('Dit werkitem verwijderen?')) return;
    App.data.bewaarWerkitems(App.data.verwijder(App.data.werkitems(), id));
    App.ui.melding('Werkitem verwijderd');
    vulTabel();
  }

  return { render, TYPE_LABEL };
})();
</script>
<script>
// Pagina: Dashboard - beschikbare vs geplande capaciteit
window.App = window.App || {};

App.pages.dashboard = (function () {
  let granulariteit = 'week';
  let refDatum = new Date();
  let splitsPerFunctie = false;
  let aantalWekenVooruit = 8;
  let uitgeklapt = new Set();

  function render(container) {
    container.innerHTML = `
      <h2>Dashboard</h2>
      <div class="card">
        <div class="toolbar">
          <div class="rij" style="margin:0;align-items:center">
            <button class="btn secundair klein" id="vorigeBtn">&larr;</button>
            <select id="granulariteitSelect">
              <option value="week">Per week</option>
              <option value="maand">Per maand</option>
              <option value="kwartaal">Per kwartaal</option>
            </select>
            <button class="btn secundair klein" id="volgendeBtn">&rarr;</button>
            <strong id="periodeLabel"></strong>
          </div>
        </div>
      </div>
      <div id="dashboardInhoud"></div>
    `;

    document.getElementById('granulariteitSelect').value = granulariteit;
    document.getElementById('granulariteitSelect').addEventListener('change', e => { granulariteit = e.target.value; tekenInhoud(); });
    document.getElementById('vorigeBtn').addEventListener('click', () => { verschuifPeriode(-1); tekenInhoud(); });
    document.getElementById('volgendeBtn').addEventListener('click', () => { verschuifPeriode(1); tekenInhoud(); });

    tekenInhoud();
  }

  function verschuifPeriode(richting) {
    const d = new Date(refDatum.getTime());
    if (granulariteit === 'week') d.setDate(d.getDate() + 7 * richting);
    else if (granulariteit === 'maand') d.setMonth(d.getMonth() + richting);
    else d.setMonth(d.getMonth() + 3 * richting);
    refDatum = d;
  }

  function tekenInhoud() {
    const bereik = App.datum.periodeBereik(granulariteit, refDatum);
    document.getElementById('periodeLabel').textContent = bereik.label;

    const medewerkers = App.data.medewerkers();
    const werkitems = App.data.werkitems();
    const verlof = App.data.verlof();
    const resultaten = App.capacity.berekenAlleMedewerkers(bereik.start, bereik.eind, medewerkers, werkitems, verlof);
    const teams = App.capacity.berekenPerGroep(resultaten, splitsPerFunctie);

    const totBeschikbaar = resultaten.reduce((s, r) => s + r.beschikbaar, 0);
    const totGepland = resultaten.reduce((s, r) => s + r.gepland, 0);
    const overbelast = resultaten.filter(r => r.status === 'rood').length;
    const onderbenut = resultaten.filter(r => r.onderbenut).length;

    const perType = { operatie: 0, valuestream: 0, project: 0, incident: 0 };
    resultaten.forEach(r => Object.keys(perType).forEach(t => perType[t] += r.perType[t]));

    document.getElementById('dashboardInhoud').innerHTML = `
      <div class="grid-3">
        <div class="card kpi"><div class="waarde">${rond(totBeschikbaar)}</div><div class="label">Beschikbare uren</div></div>
        <div class="card kpi"><div class="waarde">${rond(totGepland)}</div><div class="label">Geplande uren</div></div>
        <div class="card kpi"><div class="waarde" style="color:${overbelast ? 'var(--rood)' : 'var(--groen)'}">${overbelast}</div><div class="label">Medewerkers overbelast</div></div>
      </div>

      <div class="card">
        <h3>Workload per medewerker</h3>
        ${onderbenut ? `<p style="font-size:13px;color:#6b7280">${onderbenut} medewerker(s) zijn onderbenut (&lt;50% van beschikbare capaciteit ingepland).</p>` : ''}
        <div class="tabel-wrap">
          <table>
            <thead><tr><th>Medewerker</th><th>Team</th><th>Beschikbaar</th><th>Gepland</th><th>Bezetting</th><th>Status</th></tr></thead>
            <tbody>${resultaten.map(rijMedewerker).join('') || '<tr><td colspan="6" class="leeg-melding">Geen medewerkers.</td></tr>'}</tbody>
          </table>
        </div>
      </div>

      <div class="grid-2">
        <div class="card">
          <div class="toolbar">
            <h3 style="margin:0">Capaciteit per team</h3>
            <label style="font-weight:normal;font-size:13px;display:flex;align-items:center;gap:4px">
              <input type="checkbox" id="splitsFunctieCheck" ${splitsPerFunctie ? 'checked' : ''}> Splits per functie
            </label>
          </div>
          <div class="tabel-wrap">
            <table>
              <thead><tr><th>Team</th>${splitsPerFunctie ? '<th>Functie</th>' : ''}<th>Beschikbaar</th><th>Gepland</th><th>Bezetting</th><th>Status</th></tr></thead>
              <tbody>${teams.map(rijTeam).join('') || `<tr><td colspan="${splitsPerFunctie ? 6 : 5}" class="leeg-melding">Geen teams.</td></tr>`}</tbody>
            </table>
          </div>
        </div>
        <div class="card">
          <h3>Verdeling type werk</h3>
          ${tekenVerdeling(perType, totGepland)}
        </div>
      </div>

      <div class="card">
        <div class="toolbar">
          <h3 style="margin:0">Vooruitblik: capaciteit per week</h3>
          <div class="veld" style="margin:0">
            <select id="aantalWekenSelect">
              <option value="4">4 weken</option>
              <option value="8">8 weken</option>
              <option value="12">12 weken</option>
              <option value="26">26 weken</option>
            </select>
          </div>
        </div>
        <p style="font-size:13px;color:#6b7280">Bezetting per medewerker per week, vanaf de huidig geselecteerde week. Zo is toekomstige capaciteit in één oogopslag te zien.</p>
        <div class="tabel-wrap">${tekenVooruitblik(medewerkers, werkitems, verlof)}</div>
      </div>
    `;

    document.getElementById('splitsFunctieCheck').addEventListener('change', e => {
      splitsPerFunctie = e.target.checked;
      tekenInhoud();
    });
    document.getElementById('aantalWekenSelect').value = aantalWekenVooruit;
    document.getElementById('aantalWekenSelect').addEventListener('change', e => {
      aantalWekenVooruit = Number(e.target.value);
      tekenInhoud();
    });
    document.querySelectorAll('[data-toggle-medewerker]').forEach(b => b.addEventListener('click', () => {
      const id = b.dataset.toggleMedewerker;
      if (uitgeklapt.has(id)) uitgeklapt.delete(id); else uitgeklapt.add(id);
      tekenInhoud();
    }));
  }

  function tekenVooruitblik(medewerkers, werkitems, verlof) {
    if (!medewerkers.length) return '<p class="leeg-melding">Geen medewerkers.</p>';
    const huidigeWeek = App.datum.periodeBereik('week', refDatum);
    const weken = [];
    let cursor = new Date(huidigeWeek.start.getTime());
    for (let i = 0; i < aantalWekenVooruit; i++) {
      const eind = new Date(cursor.getTime()); eind.setDate(cursor.getDate() + 6);
      const wk = App.datum.isoWeek(cursor);
      weken.push({ start: new Date(cursor.getTime()), eind, nr: wk.week, sub: App.datum.formatKort(cursor) });
      cursor.setDate(cursor.getDate() + 7);
    }

    const header = `<tr><th>Medewerker</th>${weken.map(w => `<th style="text-align:center">Wk ${w.nr}<br><span style="font-weight:normal;font-size:11px">${w.sub}</span></th>`).join('')}</tr>`;
    const rijen = medewerkers.map(m => {
      const cellen = weken.map(w => {
        const r = App.capacity.berekenMedewerker(m, w.start, w.eind, werkitems, verlof);
        if (r.opVerlof) return `<td style="text-align:center;color:#9ca3af;font-style:italic" title="Op verlof deze week">verlof</td>`;
        const pct = Math.round(r.ratio * 100);
        const bgVar = r.status === 'rood' ? '--rood-bg' : r.status === 'oranje' ? '--oranje-bg' : '--groen-bg';
        const kleurVar = r.status === 'rood' ? '--rood' : r.status === 'oranje' ? '--oranje' : '--groen';
        const titel = `${rond(r.beschikbaar)}u beschikbaar, ${rond(r.gepland)}u gepland${r.overbelastMetVerlof ? ' (incl. verlof)' : ''}`;
        return `<td style="text-align:center;background:var(${bgVar});color:var(${kleurVar});font-weight:600" title="${titel}">${pct}%</td>`;
      }).join('');
      return `<tr><td>${App.ui.escapeHtml(m.naam)}</td>${cellen}</tr>`;
    }).join('');

    return `<table><thead>${header}</thead><tbody>${rijen}</tbody></table>`;
  }

  function rond(n) { return Math.round(n * 10) / 10; }

  function balk(ratio, status) {
    const pct = Math.min(100, Math.round(ratio * 100));
    return `<div class="balk-track"><div class="balk-vulling ${status}" style="width:${pct}%"></div></div>`;
  }

  function badgeKlasse(r) {
    if (r.status !== 'groen') return r.status;
    return r.opVerlof ? 'neutraal' : 'groen';
  }

  function rijMedewerker(r) {
    const isOpen = uitgeklapt.has(r.medewerker.id);
    const hoofdRij = `<tr>
      <td>
        <button type="button" class="btn secundair klein" data-toggle-medewerker="${r.medewerker.id}" style="margin-right:6px">${isOpen ? '▾' : '▸'}</button>${App.ui.escapeHtml(r.medewerker.naam)}
      </td>
      <td>${App.ui.escapeHtml(r.medewerker.team)}</td>
      <td>${rond(r.beschikbaar)}u</td>
      <td>${rond(r.gepland)}u</td>
      <td style="min-width:120px">${balk(r.ratio, r.status)} ${Math.round(r.ratio * 100)}%</td>
      <td><span class="badge ${badgeKlasse(r)}">${labelStatusMedewerker(r)}</span></td>
    </tr>`;
    if (!isOpen) return hoofdRij;
    return hoofdRij + `<tr><td colspan="6" style="background:var(--grijs-bg)">${tekenWerkitemDetails(r)}</td></tr>`;
  }

  function tekenWerkitemDetails(r) {
    if (!r.werkitemDetails.length) {
      return '<p class="leeg-melding" style="margin:4px 0">Geen werkitems in deze periode.</p>';
    }
    const labels = App.pages.werkitems.TYPE_LABEL;
    const rijen = r.werkitemDetails.map(w => `<tr>
      <td>${App.ui.escapeHtml(w.titel)}</td>
      <td>${labels[w.type] || w.type}</td>
      <td>${rond(w.uren)}u</td>
      <td>${App.ui.escapeHtml(w.status)}</td>
    </tr>`).join('');
    return `<table style="margin:4px 0">
      <thead><tr><th>Werkitem</th><th>Type</th><th>Uren (deze periode)</th><th>Status</th></tr></thead>
      <tbody>${rijen}</tbody>
    </table>`;
  }

  function rijTeam(t) {
    const ratio = t.ratio;
    return `<tr>
      <td>${App.ui.escapeHtml(t.team)}</td>
      ${t.rol !== null && t.rol !== undefined ? `<td>${App.ui.escapeHtml(t.rol)}</td>` : ''}
      <td>${rond(t.beschikbaar)}u</td>
      <td>${rond(t.gepland)}u</td>
      <td style="min-width:120px">${balk(ratio, t.status)} ${Math.round(ratio * 100)}%</td>
      <td><span class="badge ${t.status}">${labelStatusGroep(t)}</span></td>
    </tr>`;
  }

  function labelStatusMedewerker(r) {
    if (r.status === 'rood') return r.overbelastMetVerlof ? 'Overbelast (incl. verlof)' : 'Overbelast';
    if (r.status === 'oranje') return 'Bijna vol';
    if (r.opVerlof) return 'Op verlof';
    return r.onderbenut ? 'Onderbenut' : 'Voldoende';
  }

  function labelStatusGroep(t) {
    if (t.status === 'rood') return 'Overbelast';
    if (t.status === 'oranje') return 'Bijna vol';
    return 'Voldoende';
  }

  function tekenVerdeling(perType, totaal) {
    const kleuren = { operatie: '#1d4ed8', valuestream: '#0891b2', project: '#7c3aed', incident: '#dc2626' };
    const labels = App.pages.werkitems.TYPE_LABEL;
    if (!totaal) return '<p class="leeg-melding">Geen geplande uren in deze periode.</p>';
    const balken = Object.keys(perType).map(t => {
      const pct = totaal > 0 ? Math.round((perType[t] / totaal) * 100) : 0;
      return `<div style="margin-bottom:8px">
        <div style="display:flex;justify-content:space-between;font-size:13px"><span>${labels[t]}</span><span>${rond(perType[t])}u (${pct}%)</span></div>
        <div class="balk-track"><div class="balk-vulling" style="width:${pct}%;background:${kleuren[t]}"></div></div>
      </div>`;
    }).join('');
    return balken;
  }

  return { render };
})();
</script>
<script>
// Pagina: Impact van verstoringen (incident/ad-hoc werk toevoegen + direct effect zien)
window.App = window.App || {};

App.pages.verstoringen = (function () {
  function render(container) {
    const medewerkers = App.data.medewerkers();
    const vandaag = App.datum.naarIso(new Date());
    container.innerHTML = `
      <h2>Impact van verstoringen</h2>
      <div class="card">
        <h3>Incident / ad-hoc werk toevoegen</h3>
        <form id="incidentForm">
          <div class="rij">
            <div class="veld" style="flex:2"><label>Titel</label><input name="titel" required placeholder="Bijv. Storing kassasysteem winkels"></div>
            <div class="veld"><label>Prioriteit</label>
              <select name="prioriteit"><option value="hoog" selected>Hoog</option><option value="gemiddeld">Gemiddeld</option><option value="laag">Laag</option></select>
            </div>
          </div>
          <div class="rij">
            <div class="veld"><label>Startdatum</label><input type="date" name="startDatum" value="${vandaag}" required></div>
            <div class="veld"><label>Einddatum</label><input type="date" name="eindDatum" value="${vandaag}" required></div>
            <div class="veld"><label>Geschatte uren</label><input type="number" name="geschatteUren" min="0" value="8" required></div>
          </div>
          <div class="veld"><label>Team</label><input name="team" value="BT"></div>
          <div class="veld">
            <label>Betrokken medewerker(s)</label>
            <div class="checklijst" id="medewerkerCheck">${medewerkers.map(m => `<label><input type="checkbox" value="${m.id}"> ${App.ui.escapeHtml(m.naam)}</label>`).join('') || '<em>Geen medewerkers</em>'}</div>
          </div>
          <div class="veld"><label>Opmerking</label><input name="opmerking"></div>
          <button type="submit" class="btn gevaar">Toevoegen en impact tonen</button>
        </form>
      </div>

      <div id="impactResultaat"></div>

      <div class="card">
        <h3>Recent toegevoegde verstoringen</h3>
        <div class="tabel-wrap">
          <table>
            <thead><tr><th>Titel</th><th>Periode</th><th>Uren</th><th>Medewerkers</th><th>Prioriteit</th><th></th></tr></thead>
            <tbody id="incidentTbody"></tbody>
          </table>
        </div>
      </div>
    `;

    vulIncidentLijst();
    document.getElementById('incidentForm').addEventListener('submit', voegToe);
  }

  function totaalUren(w) {
    return Object.values(w.weekUren || {}).reduce((som, perWeek) =>
      som + Object.values(perWeek).reduce((s, u) => s + (Number(u) || 0), 0), 0);
  }

  function vulIncidentLijst() {
    const medewerkers = App.data.medewerkers();
    const naamVan = id => (medewerkers.find(m => m.id === id) || {}).naam || 'Onbekend';
    const lijst = App.data.werkitems().filter(w => w.type === 'incident').sort((a, b) => b.startDatum.localeCompare(a.startDatum));
    const tbody = document.getElementById('incidentTbody');
    if (!lijst.length) {
      tbody.innerHTML = '<tr><td colspan="6" class="leeg-melding">Nog geen verstoringen geregistreerd.</td></tr>';
      return;
    }
    tbody.innerHTML = lijst.map(w => `
      <tr>
        <td>${App.ui.escapeHtml(w.titel)}</td>
        <td>${w.startDatum} &rarr; ${w.eindDatum}</td>
        <td>${totaalUren(w)}</td>
        <td>${w.medewerkerIds.map(id => App.ui.escapeHtml(naamVan(id))).join(', ')}</td>
        <td>${App.ui.escapeHtml(w.prioriteit)}</td>
        <td><button class="btn gevaar klein" data-id="${w.id}">Verwijder</button></td>
      </tr>
    `).join('');
    tbody.querySelectorAll('button[data-id]').forEach(b => b.addEventListener('click', () => {
      if (!confirm('Deze verstoring verwijderen?')) return;
      App.data.bewaarWerkitems(App.data.verwijder(App.data.werkitems(), b.dataset.id));
      vulIncidentLijst();
      document.getElementById('impactResultaat').innerHTML = '';
    }));
  }

  function snapshot(medewerkerIds, bereik, medewerkers, werkitems, verlof) {
    return medewerkerIds.map(id => {
      const medewerker = medewerkers.find(m => m.id === id);
      return App.capacity.berekenMedewerker(medewerker, bereik.start, bereik.eind, werkitems, verlof);
    });
  }

  function voegToe(e) {
    e.preventDefault();
    const form = e.target;
    const medewerkerIds = [...document.querySelectorAll('#medewerkerCheck input:checked')].map(cb => cb.value);
    const startDatum = form.startDatum.value, eindDatum = form.eindDatum.value;
    const geschatteUren = Number(form.geschatteUren.value) || 0;

    if (!form.titel.value.trim() || startDatum > eindDatum || !medewerkerIds.length) {
      App.ui.melding('Controleer titel, periode en minimaal 1 betrokken medewerker');
      return;
    }

    const nieuw = App.model.nieuwWerkitem({
      titel: form.titel.value.trim(),
      type: 'incident',
      startDatum, eindDatum,
      medewerkerIds,
      team: form.team.value.trim(),
      prioriteit: form.prioriteit.value,
      status: 'lopend',
      opmerking: form.opmerking.value.trim(),
      weekUren: App.capacity.verdeelGelijkOverWeken(startDatum, eindDatum, medewerkerIds, geschatteUren)
    });

    const medewerkers = App.data.medewerkers();
    const verlof = App.data.verlof();
    const bereik = App.datum.periodeBereik('week', App.datum.parseIso(nieuw.startDatum));
    const werkitemsVoor = App.data.werkitems();
    const voor = snapshot(medewerkerIds, bereik, medewerkers, werkitemsVoor, verlof);

    const werkitemsNa = App.data.upsert([...werkitemsVoor], nieuw);
    App.data.bewaarWerkitems(werkitemsNa);
    const na = snapshot(medewerkerIds, bereik, medewerkers, werkitemsNa, verlof);

    const teamsVoor = App.capacity.berekenPerTeam(App.capacity.berekenAlleMedewerkers(bereik.start, bereik.eind, medewerkers, werkitemsVoor, verlof));
    const teamsNa = App.capacity.berekenPerTeam(App.capacity.berekenAlleMedewerkers(bereik.start, bereik.eind, medewerkers, werkitemsNa, verlof));

    toonImpact(bereik, voor, na, teamsVoor, teamsNa);
    App.ui.melding('Verstoring toegevoegd, impact hieronder weergegeven');
    form.reset();
    form.startDatum.value = App.datum.naarIso(new Date());
    form.eindDatum.value = App.datum.naarIso(new Date());
    form.team.value = 'BT';
    vulIncidentLijst();
  }

  function rond(n) { return Math.round(n * 10) / 10; }

  function labelStatus(status) {
    if (status === 'rood') return 'Overbelast';
    if (status === 'oranje') return 'Bijna vol';
    return 'Voldoende';
  }

  function toonImpact(bereik, voor, na, teamsVoor, teamsNa) {
    const rijen = na.map((r, i) => {
      const v = voor[i];
      const nieuwOverbelast = v.status !== 'rood' && r.status === 'rood';
      return `<tr${nieuwOverbelast ? ' style="background:var(--rood-bg)"' : ''}>
        <td>${App.ui.escapeHtml(r.medewerker.naam)}</td>
        <td>${rond(r.beschikbaar)}u</td>
        <td>${rond(v.gepland)}u &rarr; ${rond(r.gepland)}u</td>
        <td>${Math.round(v.ratio * 100)}% &rarr; ${Math.round(r.ratio * 100)}%</td>
        <td><span class="badge ${v.status}">${labelStatus(v.status)}</span> &rarr; <span class="badge ${r.status}">${labelStatus(r.status)}</span></td>
      </tr>`;
    }).join('');

    const teamRijen = teamsNa.map(t => {
      const tv = teamsVoor.find(x => x.team === t.team) || t;
      return `<tr>
        <td>${App.ui.escapeHtml(t.team)}</td>
        <td>${rond(tv.gepland)}u &rarr; ${rond(t.gepland)}u</td>
        <td>${Math.round(tv.ratio * 100)}% &rarr; ${Math.round(t.ratio * 100)}%</td>
        <td><span class="badge ${tv.status}">${labelStatus(tv.status)}</span> &rarr; <span class="badge ${t.status}">${labelStatus(t.status)}</span></td>
      </tr>`;
    }).join('');

    document.getElementById('impactResultaat').innerHTML = `
      <div class="card">
        <h3>Impact op ${App.ui.escapeHtml(bereik.label)}</h3>
        <h4>Betrokken medewerkers</h4>
        <div class="tabel-wrap">
          <table>
            <thead><tr><th>Medewerker</th><th>Beschikbaar</th><th>Gepland (voor &rarr; na)</th><th>Bezetting</th><th>Status</th></tr></thead>
            <tbody>${rijen}</tbody>
          </table>
        </div>
        <h4>Betrokken teams</h4>
        <div class="tabel-wrap">
          <table>
            <thead><tr><th>Team</th><th>Gepland (voor &rarr; na)</th><th>Bezetting</th><th>Status</th></tr></thead>
            <tbody>${teamRijen}</tbody>
          </table>
        </div>
      </div>
    `;
  }

  return { render };
})();
</script>
<script>
// Pagina: Rapportages
window.App = window.App || {};

App.pages.rapportages = (function () {
  let type = 'management';
  let granulariteit = 'maand';
  let refDatum = new Date();

  const TYPES = {
    management: 'Managementoverzicht',
    teamKnelpunten: 'Knelpunten per team',
    medewerkerKnelpunten: 'Knelpunten per medewerker',
    waardestroom: 'Verdeling per waardestroom',
    applicatie: 'Verdeling per applicatie'
  };

  function render(container) {
    container.innerHTML = `
      <h2>Rapportages</h2>
      <div class="card">
        <div class="toolbar">
          <div class="rij" style="margin:0;align-items:center">
            <select id="typeSelect">${Object.entries(TYPES).map(([k, v]) => `<option value="${k}">${v}</option>`).join('')}</select>
            <button class="btn secundair klein" id="vorigeBtn">&larr;</button>
            <select id="granulariteitSelect">
              <option value="week">Week</option>
              <option value="maand">Maand</option>
              <option value="kwartaal">Kwartaal</option>
            </select>
            <button class="btn secundair klein" id="volgendeBtn">&rarr;</button>
            <strong id="periodeLabel"></strong>
          </div>
          <button class="btn" id="exportBtn">Exporteer naar CSV</button>
        </div>
      </div>
      <div id="rapportInhoud"></div>
    `;

    document.getElementById('typeSelect').value = type;
    document.getElementById('granulariteitSelect').value = granulariteit;
    document.getElementById('typeSelect').addEventListener('change', e => { type = e.target.value; teken(); });
    document.getElementById('granulariteitSelect').addEventListener('change', e => { granulariteit = e.target.value; teken(); });
    document.getElementById('vorigeBtn').addEventListener('click', () => { verschuif(-1); teken(); });
    document.getElementById('volgendeBtn').addEventListener('click', () => { verschuif(1); teken(); });
    document.getElementById('exportBtn').addEventListener('click', exporteer);

    teken();
  }

  function verschuif(richting) {
    const d = new Date(refDatum.getTime());
    if (granulariteit === 'week') d.setDate(d.getDate() + 7 * richting);
    else if (granulariteit === 'maand') d.setMonth(d.getMonth() + richting);
    else d.setMonth(d.getMonth() + 3 * richting);
    refDatum = d;
  }

  let huidigeTabel = { kop: [], rijen: [] };

  function teken() {
    const bereik = App.datum.periodeBereik(granulariteit, refDatum);
    document.getElementById('periodeLabel').textContent = bereik.label;

    const medewerkers = App.data.medewerkers();
    const werkitems = App.data.werkitems();
    const verlof = App.data.verlof();
    const resultaten = App.capacity.berekenAlleMedewerkers(bereik.start, bereik.eind, medewerkers, werkitems, verlof);
    const teams = App.capacity.berekenPerTeam(resultaten);

    let html = '';
    if (type === 'management') html = rapportManagement(resultaten, teams);
    else if (type === 'teamKnelpunten') html = rapportTeamKnelpunten(teams);
    else if (type === 'medewerkerKnelpunten') html = rapportMedewerkerKnelpunten(resultaten);
    else if (type === 'waardestroom') html = rapportGroepering(werkitems, bereik, 'waardestroom', 'Waardestroom');
    else if (type === 'applicatie') html = rapportGroepering(werkitems, bereik, 'applicatie', 'Applicatie');

    document.getElementById('rapportInhoud').innerHTML = html;
  }

  function rond(n) { return Math.round(n * 10) / 10; }

  function rapportManagement(resultaten, teams) {
    const totBeschikbaar = resultaten.reduce((s, r) => s + r.beschikbaar, 0);
    const totGepland = resultaten.reduce((s, r) => s + r.gepland, 0);
    const overbelast = resultaten.filter(r => r.status === 'rood').length;
    const onderbenut = resultaten.filter(r => r.onderbenut).length;

    huidigeTabel = {
      kop: ['Team', 'Beschikbaar (u)', 'Gepland (u)', 'Bezetting (%)', 'Status'],
      rijen: teams.map(t => [t.team, rond(t.beschikbaar), rond(t.gepland), Math.round(t.ratio * 100), labelStatusGroep(t)])
    };

    return `
      <div class="grid-3">
        <div class="card kpi"><div class="waarde">${rond(totBeschikbaar)}</div><div class="label">Beschikbare uren</div></div>
        <div class="card kpi"><div class="waarde">${rond(totGepland)}</div><div class="label">Geplande uren</div></div>
        <div class="card kpi"><div class="waarde">${overbelast} / ${onderbenut}</div><div class="label">Overbelast / onderbenut (medewerkers)</div></div>
      </div>
      <div class="card">
        <h3>Capaciteit per team</h3>
        <div class="tabel-wrap"><table>
          <thead><tr><th>Team</th><th>Beschikbaar</th><th>Gepland</th><th>Bezetting</th><th>Status</th></tr></thead>
          <tbody>${teams.map(t => `<tr><td>${App.ui.escapeHtml(t.team)}</td><td>${rond(t.beschikbaar)}u</td><td>${rond(t.gepland)}u</td><td>${Math.round(t.ratio * 100)}%</td><td><span class="badge ${t.status}">${labelStatusGroep(t)}</span></td></tr>`).join('') || '<tr><td colspan="5" class="leeg-melding">Geen data.</td></tr>'}</tbody>
        </table></div>
      </div>
    `;
  }

  function rapportTeamKnelpunten(teams) {
    const gesorteerd = [...teams].sort((a, b) => b.ratio - a.ratio);
    huidigeTabel = {
      kop: ['Team', 'Beschikbaar (u)', 'Gepland (u)', 'Bezetting (%)', 'Status', 'Aantal medewerkers overbelast'],
      rijen: gesorteerd.map(t => [t.team, rond(t.beschikbaar), rond(t.gepland), Math.round(t.ratio * 100), labelStatusGroep(t), t.medewerkers.filter(m => m.status === 'rood').length])
    };
    return `<div class="card"><h3>Knelpunten per team</h3><div class="tabel-wrap"><table>
      <thead><tr><th>Team</th><th>Beschikbaar</th><th>Gepland</th><th>Bezetting</th><th>Status</th><th>Overbelaste medewerkers</th></tr></thead>
      <tbody>${gesorteerd.map(t => `<tr><td>${App.ui.escapeHtml(t.team)}</td><td>${rond(t.beschikbaar)}u</td><td>${rond(t.gepland)}u</td><td>${Math.round(t.ratio * 100)}%</td><td><span class="badge ${t.status}">${labelStatusGroep(t)}</span></td><td>${t.medewerkers.filter(m => m.status === 'rood').length}</td></tr>`).join('') || '<tr><td colspan="6" class="leeg-melding">Geen data.</td></tr>'}</tbody>
    </table></div></div>`;
  }

  function labelStatusGroep(t) {
    if (t.status === 'rood') return 'Overbelast';
    if (t.status === 'oranje') return 'Bijna vol';
    return 'Voldoende';
  }

  function rapportMedewerkerKnelpunten(resultaten) {
    const gesorteerd = [...resultaten].sort((a, b) => b.ratio - a.ratio);
    huidigeTabel = {
      kop: ['Medewerker', 'Team', 'Beschikbaar (u)', 'Gepland (u)', 'Bezetting (%)', 'Status'],
      rijen: gesorteerd.map(r => [r.medewerker.naam, r.medewerker.team, rond(r.beschikbaar), rond(r.gepland), Math.round(r.ratio * 100), labelStatus(r)])
    };
    return `<div class="card"><h3>Knelpunten per medewerker</h3><div class="tabel-wrap"><table>
      <thead><tr><th>Medewerker</th><th>Team</th><th>Beschikbaar</th><th>Gepland</th><th>Bezetting</th><th>Status</th></tr></thead>
      <tbody>${gesorteerd.map(r => `<tr><td>${App.ui.escapeHtml(r.medewerker.naam)}</td><td>${App.ui.escapeHtml(r.medewerker.team)}</td><td>${rond(r.beschikbaar)}u</td><td>${rond(r.gepland)}u</td><td>${Math.round(r.ratio * 100)}%</td><td><span class="badge ${badgeKlasse(r)}">${labelStatus(r)}</span></td></tr>`).join('') || '<tr><td colspan="6" class="leeg-melding">Geen data.</td></tr>'}</tbody>
    </table></div></div>`;
  }

  function badgeKlasse(r) {
    if (r.status !== 'groen') return r.status;
    return r.opVerlof ? 'neutraal' : 'groen';
  }

  function labelStatus(r) {
    if (r.status === 'rood') return r.overbelastMetVerlof ? 'Overbelast (incl. verlof)' : 'Overbelast';
    if (r.status === 'oranje') return 'Bijna vol';
    if (r.opVerlof) return 'Op verlof';
    return r.onderbenut ? 'Onderbenut' : 'Voldoende';
  }

  function rapportGroepering(werkitems, bereik, veld, titel) {
    const groepen = {};
    werkitems.forEach(w => {
      const uren = App.capacity.werkitemUrenInPeriode(w, bereik.start, bereik.eind);
      if (uren <= 0) return;
      const key = w[veld] || 'Onbekend';
      groepen[key] = (groepen[key] || 0) + uren;
    });
    const totaal = Object.values(groepen).reduce((s, v) => s + v, 0);
    const rijen = Object.entries(groepen).sort((a, b) => b[1] - a[1]);

    huidigeTabel = {
      kop: [titel, 'Uren', 'Aandeel (%)'],
      rijen: rijen.map(([naam, uren]) => [naam, rond(uren), totaal ? Math.round((uren / totaal) * 100) : 0])
    };

    return `<div class="card"><h3>${titel}</h3>
      <div class="tabel-wrap"><table>
        <thead><tr><th>${titel}</th><th>Uren</th><th>Aandeel</th></tr></thead>
        <tbody>${rijen.map(([naam, uren]) => `<tr><td>${App.ui.escapeHtml(naam)}</td><td>${rond(uren)}u</td><td>${totaal ? Math.round((uren / totaal) * 100) : 0}%</td></tr>`).join('') || '<tr><td colspan="3" class="leeg-melding">Geen geplande uren in deze periode.</td></tr>'}</tbody>
      </table></div>
    </div>`;
  }

  function exporteer() {
    App.ui.downloadCsv(`rapport-${type}-${App.datum.naarIso(new Date())}.csv`, [huidigeTabel.kop, ...huidigeTabel.rijen]);
  }

  return { render };
})();
</script>
<script>
// Navigatie tussen pagina's. Elke pagina-module (App.pages.xxx) heeft een render(container)-functie.
window.App = window.App || {};
App.pages = App.pages || {};

(function () {
  const container = document.getElementById('pageContent');

  function render(pagina) {
    document.querySelectorAll('.tab').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.page === pagina);
    });
    const mod = App.pages[pagina];
    if (mod && mod.render) {
      mod.render(container);
    } else {
      container.innerHTML = '<p class="leeg-melding">Pagina nog niet beschikbaar.</p>';
    }
  }

  document.getElementById('mainNav').addEventListener('click', e => {
    const btn = e.target.closest('.tab');
    if (!btn) return;
    render(btn.dataset.page);
  });

  document.addEventListener('DOMContentLoaded', () => {
    App.seed();
    App.auth.init(() => render('dashboard'));
  });
})();
</script>
