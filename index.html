<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BT Capaciteitsplanning</title>
<style>
:root {
  --blauw: #1d4ed8;
  --blauw-licht: #eff6ff;
  --grijs-bg: #f3f4f6;
  --grijs-rand: #d1d5db;
  --tekst: #1f2937;
  --groen: #16a34a;
  --groen-bg: #dcfce7;
  --oranje: #d97706;
  --oranje-bg: #fef3c7;
  --rood: #dc2626;
  --rood-bg: #fee2e2;
  --standby: #4f46e5;
  --standby-bg: #e0e7ff;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: "Segoe UI", Arial, sans-serif;
  background: var(--grijs-bg);
  color: var(--tekst);
}

.topbar {
  background: white;
  border-bottom: 1px solid var(--grijs-rand);
  padding: 12px 24px;
}

.topbar h1 {
  font-size: 18px;
  margin: 0;
}

.hidden { display: none !important; }

.login-scherm {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--grijs-bg);
}

.login-kaart {
  background: white;
  border: 1px solid var(--grijs-rand);
  border-radius: 10px;
  padding: 32px;
  width: 320px;
  box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
}

.login-kaart h1 { font-size: 18px; margin: 0 0 4px 0; }
.login-sub { font-size: 13px; color: #6b7280; margin: 0 0 16px 0; }
.login-fout { color: var(--rood); font-size: 13px; margin: 6px 0 0 0; }
.login-hint { font-size: 12px; color: #6b7280; margin: 14px 0 0 0; text-align: center; }
.login-kaart button.btn { width: 100%; margin-top: 6px; }

.badge-proto {
  font-size: 11px;
  font-weight: normal;
  background: var(--oranje-bg);
  color: var(--oranje);
  padding: 2px 8px;
  border-radius: 10px;
  vertical-align: middle;
}

.tabs { display: flex; gap: 4px; flex-wrap: wrap; }

.tab {
  background: none;
  border: none;
  padding: 8px 14px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 14px;
  color: var(--tekst);
}

.tab:hover { background: var(--grijs-bg); }

.tab.active {
  background: var(--blauw);
  color: white;
}

main#pageContent {
  padding: 20px 24px;
  max-width: 1400px;
  margin: 0 auto;
}

h2 { font-size: 20px; margin-top: 0; }
h3 { font-size: 16px; }

.card {
  background: white;
  border: 1px solid var(--grijs-rand);
  border-radius: 8px;
  padding: 16px;
  margin-bottom: 16px;
}

.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }
@media (max-width: 900px) {
  .grid-2, .grid-3 { grid-template-columns: 1fr; }
}

form .veld { margin-bottom: 10px; display: flex; flex-direction: column; gap: 4px; }
form .rij { display: flex; gap: 12px; flex-wrap: wrap; }
form .rij .veld { flex: 1; min-width: 160px; }

label { font-size: 13px; font-weight: 600; color: #4b5563; }

input, select, textarea, button.btn {
  font-family: inherit;
  font-size: 14px;
  padding: 7px 10px;
  border: 1px solid var(--grijs-rand);
  border-radius: 6px;
  background: white;
  color: var(--tekst);
}

textarea { resize: vertical; }

.checklijst { display: flex; flex-wrap: wrap; gap: 8px 16px; border: 1px solid var(--grijs-rand); border-radius: 6px; padding: 8px; }
.checklijst label { font-weight: normal; display: flex; align-items: center; gap: 4px; }

button.btn {
  cursor: pointer;
  background: var(--blauw);
  color: white;
  border-color: var(--blauw);
  font-weight: 600;
}
button.btn:hover { opacity: 0.9; }
button.btn.secundair { background: white; color: var(--tekst); border-color: var(--grijs-rand); }
button.btn.gevaar { background: var(--rood); border-color: var(--rood); }
button.btn.klein { padding: 4px 8px; font-size: 12px; }

table { width: 100%; border-collapse: collapse; font-size: 13px; }
table th, table td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--grijs-rand); }
table th { background: var(--grijs-bg); font-weight: 600; white-space: nowrap; }
table tbody tr:hover { background: var(--blauw-licht); }
.tabel-wrap { overflow-x: auto; }

.status-punt { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; }
.groen { background: var(--groen); }
.oranje { background: var(--oranje); }
.rood { background: var(--rood); }

.badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 12px; font-weight: 600; }
.badge.groen { background: var(--groen-bg); color: var(--groen); }
.badge.oranje { background: var(--oranje-bg); color: var(--oranje); }
.badge.rood { background: var(--rood-bg); color: var(--rood); }
.badge.neutraal { background: var(--grijs-bg); color: #4b5563; }
.badge.standby { background: var(--standby-bg); color: var(--standby); }

tr.week-header td {
  background: var(--blauw-licht);
  color: var(--blauw);
  font-weight: 700;
  border-top: 3px solid var(--blauw);
  padding: 6px 8px;
}
tr.niet-werkdag td { background: #f9fafb; color: #9ca3af; }
tr.niet-werkdag td:first-child, tr.niet-werkdag td:nth-child(2) { font-style: italic; }

.balk-track { background: var(--grijs-bg); border-radius: 4px; height: 10px; overflow: hidden; width: 100%; }
.balk-vulling { height: 100%; }
.balk-vulling.groen { background: var(--groen); }
.balk-vulling.oranje { background: var(--oranje); }
.balk-vulling.rood { background: var(--rood); }

.kpi { text-align: center; }
.kpi .waarde { font-size: 26px; font-weight: 700; }
.kpi .label { font-size: 12px; color: #6b7280; }

.toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; gap: 10px; flex-wrap: wrap; }

.toast {
  position: fixed;
  bottom: 20px;
  right: 20px;
  background: var(--tekst);
  color: white;
  padding: 10px 16px;
  border-radius: 6px;
  font-size: 14px;
  z-index: 100;
}
.toast.hidden { display: none; }

.leeg-melding { color: #6b7280; font-style: italic; padding: 12px 0; }

.legenda { display: flex; gap: 16px; font-size: 12px; color: #4b5563; margin-bottom: 10px; }
.legenda span { display: flex; align-items: center; }
</style>
</head>
<body>
<div id="loginScherm" class="login-scherm">
  <form id="loginForm" class="login-kaart">
    <h1>BT Capaciteitsplanning</h1>
    <p class="login-sub">Log in om verder te gaan</p>
    <div class="veld"><label>Gebruikersnaam</label><input name="gebruiker" autocomplete="username" required></div>
    <div class="veld"><label>Wachtwoord</label><input name="wachtwoord" type="password" autocomplete="current-password" required></div>
    <p id="loginFout" class="login-fout hidden">Onjuiste gebruikersnaam of wachtwoord.</p>
    <button type="submit" class="btn">Inloggen</button>
    <p class="login-hint">Prototype-inlog: gebruikersnaam <strong>BT</strong>, wachtwoord <strong>BT</strong>.</p>
  </form>
</div>

<div id="appShell" class="hidden">
  <header class="topbar">
    <div class="toolbar">
      <h1>BT Capaciteitsplanning <span class="badge-proto">prototype</span></h1>
      <button id="uitloggenBtn" class="btn secundair klein">Uitloggen</button>
    </div>
    <nav id="mainNav" class="tabs">
      <button data-page="dashboard" class="tab active">Dashboard</button>
      <button data-page="medewerkers" class="tab">Medewerkers</button>
      <button data-page="verlof" class="tab">Verlof</button>
      <button data-page="werkitems" class="tab">Capaciteitsplanning</button>
      <button data-page="verstoringen" class="tab">Verstoringen</button>
      <button data-page="rapportages" class="tab">Rapportages</button>
    </nav>
  </header>

  <main id="pageContent"></main>
</div>

<div id="toast" class="toast hidden"></div>

<script>
// Eenvoudig inlogscherm voor het prototype. LET OP: dit is client-side en dus geen
// echte beveiliging (te omzeilen via devtools) - puur een toegangsscherm voor de demo.
// Later te vervangen door echte authenticatie zonder de rest van de app te hoeven wijzigen.
window.App = window.App || {};

App.auth = (function () {
  const GEBRUIKER = 'BT';
  const WACHTWOORD = 'BT';
  const SLEUTEL = 'btcp_ingelogd';

  function isIngelogd() {
    return sessionStorage.getItem(SLEUTEL) === 'ja';
  }

  function controleer(gebruiker, wachtwoord) {
    return gebruiker.trim().toUpperCase() === GEBRUIKER && wachtwoord.trim().toUpperCase() === WACHTWOORD;
  }

  function uitloggen() {
    sessionStorage.removeItem(SLEUTEL);
  }

  function toonApp() {
    document.getElementById('loginScherm').classList.add('hidden');
    document.getElementById('appShell').classList.remove('hidden');
  }

  function toonLogin() {
    document.getElementById('appShell').classList.add('hidden');
    document.getElementById('loginScherm').classList.remove('hidden');
    document.getElementById('loginForm').reset();
    document.getElementById('loginFout').classList.add('hidden');
  }

  function init(bijGeslaagd) {
    document.getElementById('loginForm').addEventListener('submit', e => {
      e.preventDefault();
      const form = e.target;
      if (controleer(form.gebruiker.value, form.wachtwoord.value)) {
        sessionStorage.setItem(SLEUTEL, 'ja');
        toonApp();
        bijGeslaagd();
      } else {
        document.getElementById('loginFout').classList.remove('hidden');
      }
    });

    document.getElementById('uitloggenBtn').addEventListener('click', () => {
      uitloggen();
      toonLogin();
    });

    if (isIngelogd()) {
      toonApp();
      bijGeslaagd();
    } else {
      toonLogin();
    }
  }

  return { isIngelogd, uitloggen, toonApp, toonLogin, init };
})();
</script>
<script>
// Generieke localStorage-laag. Later te vervangen door een API (bv. voor JIRA-sync)
// zonder dat de rest van de app hoeft te weten waar de data vandaan komt.
window.App = window.App || {};

App.storage = (function () {
  const PREFIX = 'btcp_';

  function laad(sleutel, standaard) {
    const raw = localStorage.getItem(PREFIX + sleutel);
    if (!raw) return standaard;
    try {
      return JSON.parse(raw);
    } catch (e) {
      console.warn('Kon data niet lezen voor', sleutel, e);
      return standaard;
    }
  }

  function bewaar(sleutel, data) {
    localStorage.setItem(PREFIX + sleutel, JSON.stringify(data));
  }

  function isGeinitialiseerd() {
    return localStorage.getItem(PREFIX + 'geinitialiseerd') === 'ja';
  }

  function markeerGeinitialiseerd() {
    localStorage.setItem(PREFIX + 'geinitialiseerd', 'ja');
  }

  return { laad, bewaar, isGeinitialiseerd, markeerGeinitialiseerd };
})();
</script>
<script>
// Datamodellen + repository-laag (CRUD bovenop App.storage).
// Employee:   { id, naam, team, rol } - beschikbaarheid gaat uit van een vaste standaard (zie capacity.js)
// LeaveEntry: { id, medewerkerId, datum, type: 'afwezig'|'standby'|'anders', opmerking, herhalend }
// WorkItem:   { id, titel, type: 'operatie'|'valuestream'|'project'|'incident',
//               startDatum, eindDatum, medewerkerIds[], team,
//               applicatie, waardestroom, prioriteit, status, opmerking,
//               weekUren: { [weekKey]: { [medewerkerId]: uren } } (verplichte weekplanning) }
window.App = window.App || {};

App.model = (function () {
  const WERK_TYPES = ['operatie', 'valuestream', 'project', 'incident'];
  const VERLOF_TYPES = ['afwezig', 'standby', 'anders'];
  const PRIORITEITEN = ['laag', 'gemiddeld', 'hoog'];
  const STATUSSEN = ['gepland', 'lopend', 'afgerond', 'geannuleerd'];

  function uid() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }

  function nieuweMedewerker(overrides) {
    return Object.assign({
      id: uid(), naam: '', team: '', rol: ''
    }, overrides);
  }

  function nieuwVerlof(overrides) {
    return Object.assign({
      id: uid(), medewerkerId: '', datum: '', type: 'afwezig', opmerking: '', herhalend: false
    }, overrides);
  }

  function nieuwWerkitem(overrides) {
    return Object.assign({
      id: uid(), titel: '', type: 'project', startDatum: '', eindDatum: '',
      medewerkerIds: [], team: '', applicatie: '',
      waardestroom: '', prioriteit: 'gemiddeld', status: 'gepland', opmerking: '', weekUren: {}
    }, overrides);
  }

  return { WERK_TYPES, VERLOF_TYPES, PRIORITEITEN, STATUSSEN, uid, nieuweMedewerker, nieuwVerlof, nieuwWerkitem };
})();

App.data = (function () {
  function medewerkers() { return App.storage.laad('medewerkers', []); }
  function bewaarMedewerkers(lijst) { App.storage.bewaar('medewerkers', lijst); }

  function verlof() { return App.storage.laad('verlof', []); }
  function bewaarVerlof(lijst) { App.storage.bewaar('verlof', lijst); }

  function werkitems() { return App.storage.laad('werkitems', []); }
  function bewaarWerkitems(lijst) { App.storage.bewaar('werkitems', lijst); }

  function upsert(lijst, item) {
    const idx = lijst.findIndex(x => x.id === item.id);
    if (idx >= 0) lijst[idx] = item; else lijst.push(item);
    return lijst;
  }

  function verwijder(lijst, id) {
    return lijst.filter(x => x.id !== id);
  }

  return {
    medewerkers, bewaarMedewerkers,
    verlof, bewaarVerlof,
    werkitems, bewaarWerkitems,
    upsert, verwijder
  };
})();

<script>
// Kleine, generieke UI- en datumhelpers die door meerdere pagina's gebruikt worden.
window.App = window.App || {};
App.pages = App.pages || {};

App.ui = (function () {
  function toon(html, elId) {
    document.getElementById(elId).innerHTML = html;
  }

  function melding(tekst) {
    const el = document.getElementById('toast');
    el.textContent = tekst;
    el.classList.remove('hidden');
    clearTimeout(melding._t);
    melding._t = setTimeout(() => el.classList.add('hidden'), 2500);
  }

  function escapeHtml(s) {
    return String(s ?? '').replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
  }

  function downloadCsv(bestandsnaam, rijen) {
    const csv = rijen.map(rij => rij.map(veld => {
      const s = String(veld ?? '');
      return /[;\n"]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
    }).join(';')).join('\r\n');
    const blob = new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8;' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = bestandsnaam;
    a.click();
    URL.revokeObjectURL(a.href);
  }

  return { toon, melding, escapeHtml, downloadCsv };
})();

App.datum = (function () {
  const MAANDEN_KORT = ['jan', 'feb', 'mrt', 'apr', 'mei', 'jun', 'jul', 'aug', 'sep', 'okt', 'nov', 'dec'];
  const DAGEN_KORT = ['Zo', 'Ma', 'Di', 'Wo', 'Do', 'Vr', 'Za'];

  function pad(n) { return String(n).padStart(2, '0'); }

  function naarIso(d) {
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  }

  function parseIso(iso) {
    const [j, m, d] = iso.split('-').map(Number);
    return new Date(j, m - 1, d);
  }

  // Herkent ISO (2025-12-29), Nederlands met maandnaam (29-dec-2025) en dd-mm-jjjj
  function parseFlexibel(tekst) {
    if (!tekst) return null;
    const s = String(tekst).trim();
    let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
    if (m) return new Date(+m[1], +m[2] - 1, +m[3]);
    m = s.match(/^(\d{1,2})-([a-zA-Z]{3,})-(\d{4})$/);
    if (m) {
      const maandIdx = MAANDEN_KORT.indexOf(m[2].toLowerCase().slice(0, 3));
      if (maandIdx >= 0) return new Date(+m[3], maandIdx, +m[1]);
    }
    m = s.match(/^(\d{1,2})-(\d{1,2})-(\d{4})$/);
    if (m) return new Date(+m[3], +m[2] - 1, +m[1]);
    const fallback = new Date(s);
    return isNaN(fallback) ? null : fallback;
  }

  function isoWeek(d) {
    const dt = new Date(d.getTime());
    dt.setHours(0, 0, 0, 0);
    dt.setDate(dt.getDate() + 3 - ((dt.getDay() + 6) % 7));
    const jaarStart = new Date(dt.getFullYear(), 0, 4);
    const weeknr = 1 + Math.round(((dt - jaarStart) / 86400000 - 3 + ((jaarStart.getDay() + 6) % 7)) / 7);
    return { jaar: dt.getFullYear(), week: weeknr };
  }

  // Nederlandse feestdagen (vast + paasgebonden via Meeus-algoritme), gecached per jaar
  const feestdagenCache = {};

  function paasZondag(jaar) {
    const a = jaar % 19, b = Math.floor(jaar / 100), c = jaar % 100;
    const d2 = Math.floor(b / 4), e = b % 4, f = Math.floor((b + 8) / 25);
    const g = Math.floor((b - f + 1) / 3), h = (19 * a + b - d2 - g + 15) % 30;
    const i = Math.floor(c / 4), k = c % 4, l = (32 + 2 * e + 2 * i - h - k) % 7;
    const m = Math.floor((a + 11 * h + 22 * l) / 451);
    const som = h + l - 7 * m + 114;
    return new Date(jaar, Math.floor(som / 31) - 1, (som % 31) + 1);
  }

  function koningsdag(jaar) {
    const d = new Date(jaar, 3, 27);
    if (d.getDay() === 0) d.setDate(26);
    return d;
  }

  function plusDagen(d, n) { const r = new Date(d); r.setDate(r.getDate() + n); return r; }

  function feestdagenVoorJaar(jaar) {
    if (feestdagenCache[jaar]) return feestdagenCache[jaar];
    const pasen = paasZondag(jaar);
    const lijst = [
      { naam: 'Nieuwjaarsdag', datum: new Date(jaar, 0, 1) },
      { naam: 'Goede Vrijdag', datum: plusDagen(pasen, -2) },
      { naam: 'Eerste Paasdag', datum: pasen },
      { naam: 'Tweede Paasdag', datum: plusDagen(pasen, 1) },
      { naam: 'Koningsdag', datum: koningsdag(jaar) },
      { naam: 'Bevrijdingsdag', datum: new Date(jaar, 4, 5) },
      { naam: 'Hemelvaartsdag', datum: plusDagen(pasen, 39) },
      { naam: 'Eerste Pinksterdag', datum: plusDagen(pasen, 49) },
      { naam: 'Tweede Pinksterdag', datum: plusDagen(pasen, 50) },
      { naam: 'Eerste Kerstdag', datum: new Date(jaar, 11, 25) },
      { naam: 'Tweede Kerstdag', datum: new Date(jaar, 11, 26) }
    ];
    feestdagenCache[jaar] = lijst;
    return lijst;
  }

  function feestdagNaam(d) {
    const treffer = feestdagenVoorJaar(d.getFullYear()).find(f =>
      f.datum.getMonth() === d.getMonth() && f.datum.getDate() === d.getDate());
    return treffer ? treffer.naam : null;
  }

  function isWerkdag(d) {
    const dag = d.getDay();
    if (dag === 0 || dag === 6) return false;
    return !feestdagNaam(d);
  }

  function alleDagenTussen(start, eind) {
    const dagen = [];
    const cur = new Date(start.getTime());
    while (cur <= eind) {
      dagen.push(new Date(cur.getTime()));
      cur.setDate(cur.getDate() + 1);
    }
    return dagen;
  }

  function werkdagenTussen(start, eind) {
    return alleDagenTussen(start, eind).filter(isWerkdag);
  }

  function volgendeWerkdag(d) {
    const r = new Date(d.getTime());
    do { r.setDate(r.getDate() + 1); } while (!isWerkdag(r));
    return r;
  }

  function weekKey(d) {
    const wk = isoWeek(d);
    return wk.jaar + '-W' + pad(wk.week);
  }

  // Geeft elke ISO-week terug die het bereik [start, eind] raakt, als {weekKey, weekStart}
  function wekenTussen(start, eind) {
    const weken = [];
    const dagOffset = (start.getDay() + 6) % 7; // maandag = 0
    let maandag = new Date(start.getFullYear(), start.getMonth(), start.getDate() - dagOffset);
    while (maandag <= eind) {
      const wk = isoWeek(maandag);
      weken.push({ weekKey: weekKey(maandag), weekStart: new Date(maandag), jaar: wk.jaar, week: wk.week });
      maandag = plusDagen(maandag, 7);
    }
    return weken;
  }

  // Geeft start/eind terug voor de periode (week/maand/kwartaal) die refDatum bevat
  function periodeBereik(granulariteit, refDatum) {
    const d = new Date(refDatum.getTime());
    if (granulariteit === 'week') {
      const dagOffset = (d.getDay() + 6) % 7; // maandag = 0
      const start = new Date(d); start.setDate(d.getDate() - dagOffset);
      const eind = new Date(start); eind.setDate(start.getDate() + 6);
      const wk = isoWeek(start);
      return { start, eind, label: `Week ${wk.week}, ${wk.jaar} (${formatKort(start)} t/m ${formatKort(eind)})` };
    }
    if (granulariteit === 'maand') {
      const start = new Date(d.getFullYear(), d.getMonth(), 1);
      const eind = new Date(d.getFullYear(), d.getMonth() + 1, 0);
      return { start, eind, label: start.toLocaleDateString('nl-NL', { month: 'long', year: 'numeric' }) };
    }
    const kwartaal = Math.floor(d.getMonth() / 3);
    const start = new Date(d.getFullYear(), kwartaal * 3, 1);
    const eind = new Date(d.getFullYear(), kwartaal * 3 + 3, 0);
    return { start, eind, label: `Q${kwartaal + 1} ${d.getFullYear()}` };
  }

  function formatKort(d) {
    return pad(d.getDate()) + '-' + MAANDEN_KORT[d.getMonth()] + '-' + d.getFullYear();
  }

  return {
    naarIso, parseIso, parseFlexibel, isoWeek, isWerkdag, alleDagenTussen, werkdagenTussen,
    volgendeWerkdag, weekKey, wekenTussen, feestdagNaam, periodeBereik, formatKort, DAGEN_KORT, MAANDEN_KORT
  };
})();
</script>
<script>
// Rekenkern: beschikbare vs geplande capaciteit per medewerker/team/periode.
// Uitgangspunten (MVP, bewust eenvoudig gehouden):
// - Standaard 8 uur per werkdag (40u/week) voor iedereen; weekend en NL-feestdagen tellen niet als werkdag
// - 'afwezig'/'anders' verlof = die dag 0 beschikbare uren; 'standby' telt niet als afwezig
// - Werkitems worden altijd per week per medewerker ingepland (weekUren); geen uren = geen planning
// - Alles vanaf 85% bezetting geldt als overbelast
window.App = window.App || {};

App.capacity = (function () {
  const STANDAARD_UUR_PER_DAG = 8;

  function statusVoorRatio(ratio) {
    if (ratio >= 0.85) return 'rood';
    if (ratio >= 0.70) return 'oranje';
    return 'groen';
  }

  function isOnderbenut(ratio) {
    return ratio < 0.5;
  }

  // Uren voor één medewerker op een werkitem binnen de opgevraagde periode, uit de weekUren-planning.
  function werkitemUrenVoorMedewerker(item, medewerkerId, periodeStart, periodeEind) {
    if (!item.weekUren) return 0;
    const weken = App.datum.wekenTussen(periodeStart, periodeEind);
    let totaal = 0;
    weken.forEach(w => {
      const perWeek = item.weekUren[w.weekKey];
      if (perWeek && perWeek[medewerkerId] != null) totaal += Number(perWeek[medewerkerId]) || 0;
    });
    return totaal;
  }

  // Totaal uren van een werkitem (alle toegewezen medewerkers) binnen de opgevraagde periode.
  function werkitemUrenInPeriode(item, periodeStart, periodeEind) {
    return item.medewerkerIds.reduce((som, id) => som + werkitemUrenVoorMedewerker(item, id, periodeStart, periodeEind), 0);
  }

  // Verdeelt een totaal aantal uren gelijk over de weken in [start, eind] en de opgegeven medewerkers.
  function verdeelGelijkOverWeken(startDatum, eindDatum, medewerkerIds, totaalUren) {
    const start = App.datum.parseFlexibel(startDatum);
    const eind = App.datum.parseFlexibel(eindDatum);
    const weekUren = {};
    if (!start || !eind || !medewerkerIds.length) return weekUren;
    const weken = App.datum.wekenTussen(start, eind);
    if (!weken.length) return weekUren;
    const perCel = Math.round((totaalUren / weken.length / medewerkerIds.length) * 10) / 10;
    weken.forEach(w => {
      weekUren[w.weekKey] = {};
      medewerkerIds.forEach(id => weekUren[w.weekKey][id] = perCel);
    });
    return weekUren;
  }

  function medewerkerBeschikbaarInPeriode(medewerker, periodeStart, periodeEind, alleVerlof) {
    const werkdagen = App.datum.werkdagenTussen(periodeStart, periodeEind);
    const verlofPerDatum = {};
    alleVerlof.filter(v => v.medewerkerId === medewerker.id).forEach(v => { verlofPerDatum[v.datum] = v; });

    let beschikbaar = 0, verlofDagen = 0, standbyDagen = 0, heeftVerlofNietHerhalend = false;
    werkdagen.forEach(dag => {
      const iso = App.datum.naarIso(dag);
      const entry = verlofPerDatum[iso];
      if (entry && (entry.type === 'afwezig' || entry.type === 'anders')) {
        verlofDagen++;
        if (!entry.herhalend) heeftVerlofNietHerhalend = true;
        return;
      }
      if (entry && entry.type === 'standby') standbyDagen++;
      beschikbaar += STANDAARD_UUR_PER_DAG;
    });
    return { beschikbaar, verlofDagen, standbyDagen, totaalWerkdagen: werkdagen.length, heeftVerlofNietHerhalend };
  }

  function berekenMedewerker(medewerker, periodeStart, periodeEind, alleWerkitems, alleVerlof) {
    const { beschikbaar, verlofDagen, standbyDagen, totaalWerkdagen, heeftVerlofNietHerhalend } =
      medewerkerBeschikbaarInPeriode(medewerker, periodeStart, periodeEind, alleVerlof);
    const relevanteItems = alleWerkitems.filter(w => w.medewerkerIds.includes(medewerker.id));
    const perType = { operatie: 0, valuestream: 0, project: 0, incident: 0 };
    const werkitemDetails = [];
    let gepland = 0;

    relevanteItems.forEach(item => {
      const uren = werkitemUrenVoorMedewerker(item, medewerker.id, periodeStart, periodeEind);
      gepland += uren;
      perType[item.type] = (perType[item.type] || 0) + uren;
      if (uren > 0) {
        werkitemDetails.push({ id: item.id, titel: item.titel, type: item.type, status: item.status, uren });
      }
    });
    werkitemDetails.sort((a, b) => b.uren - a.uren);

    const ratio = beschikbaar > 0 ? gepland / beschikbaar : (gepland > 0 ? 2 : 0);
    // Iemand die de hele periode op verlof is, is niet "onderbenut" - er is simpelweg geen capaciteit.
    const opVerlof = totaalWerkdagen > 0 && verlofDagen === totaalWerkdagen;
    const onderbenut = !opVerlof && isOnderbenut(ratio);
    const status = statusVoorRatio(ratio);

    return {
      medewerker, beschikbaar, gepland, verlofDagen, standbyDagen, totaalWerkdagen, perType, werkitemDetails, ratio, status,
      onderbenut, opVerlof, overbelastMetVerlof: status === 'rood' && heeftVerlofNietHerhalend
    };
  }

  function berekenAlleMedewerkers(periodeStart, periodeEind, medewerkers, werkitems, verlof) {
    return medewerkers.map(m => berekenMedewerker(m, periodeStart, periodeEind, werkitems, verlof));
  }

  // opFunctie=true groepeert op team + rol i.p.v. alleen team
  function berekenPerGroep(resultatenPerMedewerker, opFunctie) {
    const groepen = {};
    resultatenPerMedewerker.forEach(r => {
      const team = r.medewerker.team || 'Onbekend';
      const rol = r.medewerker.rol || 'Onbekend';
      const key = opFunctie ? team + ' — ' + rol : team;
      if (!groepen[key]) groepen[key] = { team, rol: opFunctie ? rol : null, beschikbaar: 0, gepland: 0, medewerkers: [] };
      groepen[key].beschikbaar += r.beschikbaar;
      groepen[key].gepland += r.gepland;
      groepen[key].medewerkers.push(r);
    });
    return Object.values(groepen).map(t => {
      const ratio = t.beschikbaar > 0 ? t.gepland / t.beschikbaar : (t.gepland > 0 ? 2 : 0);
      return Object.assign(t, { ratio, status: statusVoorRatio(ratio) });
    });
  }

  function berekenPerTeam(resultatenPerMedewerker) {
    return berekenPerGroep(resultatenPerMedewerker, false);
  }

  return {
    STANDAARD_UUR_PER_DAG, statusVoorRatio, isOnderbenut, werkitemUrenInPeriode, werkitemUrenVoorMedewerker,
    verdeelGelijkOverWeken, medewerkerBeschikbaarInPeriode, berekenMedewerker, berekenAlleMedewerkers,
    berekenPerGroep, berekenPerTeam
  };
})();
</script>
<script>
// Pagina: Medewerkers beheren (CRUD)
window.App = window.App || {};

App.pages.medewerkers = (function () {
  let bewerkId = null;

  function render(container) {
    const lijst = App.data.medewerkers();
    container.innerHTML = `
      <h2>Medewerkers</h2>
      <div class="card">
        <h3 id="formTitel">Nieuwe medewerker</h3>
        <form id="medewerkerForm">
          <div class="rij">
            <div class="veld"><label>Naam</label><input name="naam" required></div>
            <div class="veld"><label>Team</label><input name="team" value="BT"></div>
            <div class="veld"><label>Rol/functie</label><input name="rol"></div>
          </div>
          <button type="submit" class="btn">Opslaan</button>
          <button type="button" id="annuleerBtn" class="btn secundair" style="display:none">Annuleren</button>
        </form>
      </div>
      <div class="card">
        <div class="tabel-wrap">
          <table>
            <thead><tr><th>Naam</th><th>Team</th><th>Rol</th><th></th></tr></thead>
            <tbody id="medewerkerTbody"></tbody>
          </table>
        </div>
      </div>
    `;

    vulTabel(lijst);
    document.getElementById('medewerkerForm').addEventListener('submit', opSlaan);
    document.getElementById('annuleerBtn').addEventListener('click', () => resetForm());
  }

  function vulTabel(lijst) {
    const tbody = document.getElementById('medewerkerTbody');
    if (!lijst.length) {
      tbody.innerHTML = '<tr><td colspan="4" class="leeg-melding">Nog geen medewerkers toegevoegd.</td></tr>';
      return;
    }
    tbody.innerHTML = lijst.map(m => `
      <tr>
        <td>${App.ui.escapeHtml(m.naam)}</td>
        <td>${App.ui.escapeHtml(m.team)}</td>
        <td>${App.ui.escapeHtml(m.rol)}</td>
        <td>
          <button class="btn secundair klein" data-actie="wijzig" data-id="${m.id}">Wijzig</button>
          <button class="btn gevaar klein" data-actie="verwijder" data-id="${m.id}">Verwijder</button>
        </td>
      </tr>
    `).join('');

    tbody.querySelectorAll('[data-actie="wijzig"]').forEach(b => b.addEventListener('click', () => beginWijzig(b.dataset.id)));
    tbody.querySelectorAll('[data-actie="verwijder"]').forEach(b => b.addEventListener('click', () => verwijder(b.dataset.id)));
  }

  function beginWijzig(id) {
    const m = App.data.medewerkers().find(x => x.id === id);
    if (!m) return;
    bewerkId = id;
    const form = document.getElementById('medewerkerForm');
    form.naam.value = m.naam;
    form.team.value = m.team;
    form.rol.value = m.rol;
    document.getElementById('formTitel').textContent = 'Medewerker wijzigen';
    document.getElementById('annuleerBtn').style.display = 'inline-block';
    form.scrollIntoView({ behavior: 'smooth' });
  }

  function resetForm() {
    bewerkId = null;
    const form = document.getElementById('medewerkerForm');
    form.reset();
    form.team.value = 'BT';
    document.getElementById('formTitel').textContent = 'Nieuwe medewerker';
    document.getElementById('annuleerBtn').style.display = 'none';
  }

  function opSlaan(e) {
    e.preventDefault();
    const form = e.target;
    const data = {
      naam: form.naam.value.trim(),
      team: form.team.value.trim(),
      rol: form.rol.value.trim()
    };
    if (!data.naam) return;

    const lijst = App.data.medewerkers();
    if (bewerkId) {
      App.data.upsert(lijst, Object.assign({ id: bewerkId }, data));
      App.ui.melding('Medewerker gewijzigd');
    } else {
      App.data.upsert(lijst, App.model.nieuweMedewerker(data));
      App.ui.melding('Medewerker toegevoegd');
    }
    App.data.bewaarMedewerkers(lijst);
    resetForm();
    vulTabel(App.data.medewerkers());
  }

  function verwijder(id) {
    if (!confirm('Deze medewerker verwijderen? Gekoppeld verlof en werkitems blijven bestaan maar verwijzen dan naar een onbekende medewerker.')) return;
    App.data.bewaarMedewerkers(App.data.verwijder(App.data.medewerkers(), id));
    App.ui.melding('Medewerker verwijderd');
    vulTabel(App.data.medewerkers());
  }

  return { render };
})();
</script>
